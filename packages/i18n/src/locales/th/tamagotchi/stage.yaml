voice-command:
  heard: 'ได้ยินว่า: {text}'
  started: กำลังฟัง พูดคำสั่งได้เลย
onboarding:
  actions:
    skip: ข้ามการตั้งค่า
    back: ย้อนกลับ
    next: ถัดไป
    finish: เริ่มใช้ชิโระ
  steps:
    welcome:
      title: สวัสดีค่ะ ชิโระเองนะ
      description: ชิโระทำงานในเครื่องนี้ และเก็บข้อมูลไว้ในเครื่องของคุณ มาตั้งค่ากัน 3 ขั้นสั้น ๆ คือโมเดลแชต เสียง และลองสั่งด้วยเสียงครั้งแรก
    brain:
      title: สมองของชิโระ
      description: ชิโระคิดด้วย Ollama ติดตั้งและเปิด Ollama แล้วเลือกโมเดล shiro จากนั้นกด ใช้โมเดลนี้
    voice:
      title: เสียงของชิโระ
      description: รอให้ระบบเสียงพร้อมก่อน แล้วกด เปิดใช้ระบบเสียง ระบบเสียงใช้เวลาโหลดประมาณ 30 วินาที
    talk:
      title: ลองสั่งด้วยเสียง
      description: เปิดไมค์ที่แถบควบคุม แล้วลองคุยกับชิโระ
      wake-word: 'พูดว่า "ชิโระ" แล้วตามด้วยคำสั่ง เช่น "ชิโระ แรมเหลือเท่าไหร่"'
      shortcut: หรือกด Ctrl+Alt+Space แล้วพูดคำสั่งได้เลยโดยไม่ต้องพูดชื่อ เปลี่ยนปุ่มลัดได้ที่ ตั้งค่า > ระบบ > ปุ่มลัดของหน้าต่าง
      heard-title: ชิโระได้ยินว่า
      heard-empty: ยังไม่ได้ยินอะไร ลองพูดใส่ไมค์ดูนะ
      accepted: ชิโระรับเป็นคำสั่งแล้ว
      ignored: ชิโระไม่ได้ยินชื่อตัวเอง ลองพูดอีกครั้ง หรือใช้ปุ่มลัดแทน
    done:
      title: พร้อมแล้ว!
      description: เปลี่ยนการตั้งค่าเหล่านี้ได้ทุกเมื่อที่ ตั้งค่า > AI ในเครื่อง

pages:
  gaming-avatar:
    title: Avatar โหมดเกม
    mode:
      title: Gaming Mode
      description: ชิโระจะเปลี่ยนเป็น avatar แบบ PNG และย่อไปอยู่มุมขวาล่างของจอ การตรวจจับเกมอัตโนมัติจะตามมาภายหลัง

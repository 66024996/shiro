      title: Avatar แบบ PNG
      description: ใส่ภาพ 1 ภาพต่อ 1 อารมณ์ ต้องมีอย่างน้อยภาพ "ปกติ" ภาพ PNG พื้นหลังโปร่งใสจะดูดีที่สุด
